  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }\n\n@font-face { font-family:'Fraunces'; font-style:italic; font-weight:600; font-display:swap;\n  src:url(\"ed52488c-16d8-40d5-a8f7-e9a73ccffefb\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family:'Fraunces'; font-style:italic; font-weight:600; font-display:swap;\n  src:url(\"6ec10544-29b0-4fc4-a9c9-bcf58abf36e9\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }\n<\u002Fstyle>\n<style>/* ===========================================================================\n   ULTREIA, COLOR\n   4 colores institucionales + sanguina (acento cálido) + técnico.\n   Mint y Sanguina son FAROS, nunca baños. Mint nunca compite con Sanguina\n   en el mismo elemento.\n   ===========================================================================*/\n:root {\n  /* ---- Marca / base ---- */\n  --night:        #0E2A33; /* Noche Ultreia, fondo por defecto, sustrato premium */\n  --night-deep:   #071A22; /* nuance interna, halos radiales sobre Noche */\n  --night-700:    #143843; /* Noche elevada, superficies/tarjetas sobre Noche */\n  --night-600:    #1C4854; /* bordes/divisores sobre Noche */\n  --pilgrim:      #F7F5EF; /* Blanco Peregrino, secciones editoriales/respiro */\n  --pilgrim-200:  #EFEBE0; /* Peregrino sombreado, tarjetas sobre Peregrino */\n  --pilgrim-300:  #E3DDCB; /* bordes sobre Peregrino */\n  --white:        #FFFFFF; /* solo PDF / contraste máximo / impresión técnica */\n\n  /* ---- Acento frío: Mint Camino (marca, navegación, faro institucional) ---- */\n  --mint:         #32B4A0;\n  --mint-600:     #36B2B6; /* vert d'eau con matiz lavanda \\u2014 hover/press, suave */\n  --mint-300:     #96C8BE; /* Mint Pálido, texto secundario sobre Noche */\n  --mint-100:     #D6EAE5; /* tinte muy suave sobre Peregrino */\n\n  /* ---- Acento cálido: Sanguina (CTAs de producto, badges, family) ----\n     Terracota que tira a rojo «sanguine», suavemente pastel, entre dorado y rojo. */\n  --sanguina:     #D2655B; /* rojo sanguina base, terracota rosado, validado */\n  --sanguina-600: #C5564E; /* hover/press, más profundo, dentro del pastel */\n  --sanguina-300: #E5A097; /* tinte pastel */\n  --sanguina-100: #F6E1DC; /* fondo de badge muy suave */\n\n  /* ---- Cálidos de ilustración (de aquí viene el grueso del calor) ---- */\n  --ember:        #C5564E; /* rojo sanguina \\u2014 con un punto de rosa pastel */\n  --amber:        #E9A93C; /* ámbar/dorado */\n  --amber-100:    #F6E4BE;\n\n  /* =========================================================================\n     ALIAS SEMÁNTICOS\n     ========================================================================= */\n\n  /* Superficies, registro institucional (oscuro) */\n  --surface:            var(--night);\n  --surface-raised:     var(--night-700);\n  --surface-overlay:    var(--night-deep);\n  --border-dark:        var(--night-600);\n\n  /* Superficies, registro editorial/producto (claro) */\n  --surface-warm:       var(--pilgrim);\n  --surface-warm-card:  var(--pilgrim-200);\n  --border-warm:        var(--pilgrim-300);\n\n  /* Texto sobre Noche */\n  --text-on-dark:        var(--pilgrim);\n  --text-on-dark-soft:   var(--mint-300);\n  --text-on-dark-muted:  #6E8A8F;\n\n  /* Texto sobre Peregrino */\n  --text:                var(--night);\n  --text-soft:           #43616A;\n  --text-muted:          #7A8E92;\n\n  /* Acentos funcionales */\n  --accent-cool:        var(--mint);    /* faro institucional */\n  --accent-cool-hover:  var(--mint-600);\n  --accent-warm:        var(--sanguina);/* CTA de producto / descubrimiento */\n  --accent-warm-hover:  var(--sanguina-600);\n\n  /* Estados */\n  --focus-ring:         var(--mint);\n  --danger:             var(--ember);\n  --highlight:          var(--amber);\n}\n<\u002Fstyle>\n<style>/* ===========================================================================\n   ULTREIA, TIPOGRAFÍA\n   Outfit → todo el sistema: UI, body, titulares y display.\n   Fraunces → SOLO citas y títulos de historia (nombres de serie / carátulas).\n   Nunca Fraunces en UI funcional, menús, botones, secciones ni body.\n   ===========================================================================*/\n:root {\n  /* Familias */\n  --font-sans:   'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-serif:  'Fraunces', 'Iowan Old Style', Georgia, serif; /* solo citas + títulos de historia */\n  --font-display: var(--font-sans); /* display de UI/editorial = Outfit */\n  --font-story:   var(--font-serif); /* alias semántico: títulos de historia y citas */\n\n  /* Pesos */\n  --w-light:     300; /* @kind font */\n  --w-regular:   400; /* @kind font */\n  --w-medium:    500; /* @kind font */\n  --w-semibold:  600; /* @kind font */\n  --w-bold:      700; /* @kind font */\n  --w-black:     800; /* @kind font */\n\n  /* Escala tipográfica (rem, base 16px), generosa, pensada para pantalla */\n  --fs-display-xl: 4.5rem;   /* 72, hero display Outfit */\n  --fs-display-l:  3.25rem;  /* 52, display Outfit */\n  --fs-display-m:  2.25rem;  /* 36, titulares grandes, citas */\n  --fs-h1:         2rem;     /* 32 */\n  --fs-h2:         1.5rem;   /* 24 */\n  --fs-h3:         1.25rem;  /* 20 */\n  --fs-body-lg:    1.125rem; /* 18 */\n  --fs-body:       1rem;     /* 16 */\n  --fs-body-sm:    0.875rem; /* 14 */\n  --fs-caption:    0.75rem;  /* 12 */\n  --fs-eyebrow:    0.6875rem;/* 11 */\n\n  /* Interlineado */\n  --lh-tight:   1.05; /* @kind other */\n  --lh-snug:    1.2;  /* @kind other */\n  --lh-normal:  1.5;  /* @kind other */\n  --lh-relaxed: 1.65; /* @kind other */\n\n  /* Tracking */\n  --ls-display:  -0.02em; /* @kind other */\n  --ls-tight:    -0.01em; /* @kind other */\n  --ls-normal:   0;       /* @kind other */\n  --ls-caption:  0.25em;  /* @kind other */\n  --ls-eyebrow:  0.3em;   /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ===========================================================================\n   ULTREIA, ESPACIADO, RADIOS, SOMBRAS, MOVIMIENTO\n   Esquinas suaves, formas orgánicas. Nada anguloso.\n   ===========================================================================*/\n:root {\n  /* Escala de espaciado (base 4px) */\n  --space-1:  0.25rem;  /*  4 */\n  --space-2:  0.5rem;   /*  8 */\n  --space-3:  0.75rem;  /* 12 */\n  --space-4:  1rem;     /* 16 */\n  --space-5:  1.5rem;   /* 24 */\n  --space-6:  2rem;     /* 32 */\n  --space-7:  3rem;     /* 48 */\n  --space-8:  4rem;     /* 64 */\n  --space-9:  6rem;     /* 96 */\n\n  /* Radios, suaves, generosos. Las tarjetas de catálogo redondean fuerte. */\n  --radius-sm:   8px;\n  --radius-md:   14px;\n  --radius-lg:   20px;\n  --radius-xl:   28px;\n  --radius-2xl:  40px;\n  --radius-pill: 999px;\n\n  /* Sombras, cálidas y suaves sobre claro; profundas y limpias sobre oscuro.\n     Nunca duras ni de dashboard. */\n  --shadow-sm:   0 1px 2px rgba(14, 42, 51, 0.06), 0 2px 6px rgba(14, 42, 51, 0.05);\n  --shadow-md:   0 4px 12px rgba(14, 42, 51, 0.08), 0 10px 30px rgba(14, 42, 51, 0.07);\n  --shadow-lg:   0 12px 28px rgba(14, 42, 51, 0.12), 0 30px 60px rgba(14, 42, 51, 0.10);\n  /* sombra cálida para carátulas/CTA de producto */\n  --shadow-warm: 0 10px 30px rgba(192, 67, 43, 0.18);\n  /* elevación sobre Noche */\n  --shadow-dark: 0 16px 40px rgba(0, 0, 0, 0.35);\n\n  /* Halo radial mint sobre Noche, el fondo nunca es plano */\n  --halo-mint: radial-gradient(60% 60% at 70% 18%, rgba(50,180,160,0.18), rgba(50,180,160,0) 70%); /* @kind other */\n  --halo-warm: radial-gradient(55% 55% at 22% 80%, rgba(226,116,47,0.14), rgba(226,116,47,0) 70%); /* @kind other */\n\n  /* Movimiento, fundidos suaves, micro-rebote en producto. Nunca brusco. */\n  --ease-soft:   cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast:    140ms; /* @kind other */\n  --dur-base:    240ms; /* @kind other */\n  --dur-slow:    420ms; /* @kind other */\n\n  /* Contenedores */\n  --container:   1200px; /* @kind spacing */\n  --container-narrow: 760px; /* @kind spacing */\n}\n<\u002Fstyle>\n<style>/* Ultreia Design System, global entry point.\n   Consumers link this single file. Keep it as @import lines only. */\n/* ===========================================================================\n   ULTREIA, WEBFONTS (auto-hospedadas, 100% offline)\n   Outfit   = voz del sistema (UI, body, titulares, display): 400–800.\n   Fraunces = SOLO citas y títulos de historia (italic 500/600).\n   Binarios en assets/fonts/ (subsets latin + latin-ext, woff2).\n   ===========================================================================*/\n\n/* ---- Outfit ---- */\n@font-face { font-family:'Outfit'; font-style:normal; font-weight:400; font-display:swap;\n  src:url(\"9d70233e-b113-4387-a1b3-9be512e3f256\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family:'Outfit'; font-style:normal; font-weight:400; font-display:swap;\n  src:url(\"6f821abd-9460-491d-81dd-72e89e2cb552\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }\n\n@font-face { font-family:'Outfit'; font-style:normal; font-weight:500; font-display:swap;\n  src:url(\"4729e220-c808-4b4e-a065-69e7ee8cb98a\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family:'Outfit'; font-style:normal; font-weight:500; font-display:swap;\n  src:url(\"a31b0998-8d00-4262-950f-e233c676c3c5\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }\n\n@font-face { font-family:'Outfit'; font-style:normal; font-weight:600; font-display:swap;\n  src:url(\"33dfe724-9281-4389-8d73-3cebd7686dc2\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family:'Outfit'; font-style:normal; font-weight:600; font-display:swap;\n  src:url(\"291c34f9-0187-4a5f-aed7-7a27c0af2d67\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }\n\n@font-face { font-family:'Outfit'; font-style:normal; font-weight:700; font-display:swap;\n  src:url(\"f3a1e4ae-2e28-4916-a4e3-606cdc88585e\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family:'Outfit'; font-style:normal; font-weight:700; font-display:swap;\n  src:url(\"00e460c6-dcd9-47de-93ea-cdb1cdfaf6fc\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }\n\n@font-face { font-family:'Outfit'; font-style:normal; font-weight:800; font-display:swap;\n  src:url(\"107b4d6c-0cc7-431e-8961-37e7bf11b1a7\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family:'Outfit'; font-style:normal; font-weight:800; font-display:swap;\n  src:url(\"3dd36657-c41d-4925-b665-c8b0e2276d5e\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }\n\n/* ---- Fraunces (italic, solo citas y títulos de historia) ---- */\n@font-face { font-family:'Fraunces'; font-style:italic; font-weight:500; font-display:swap;\n  src:url(\"e8900ebd-caad-461e-b0ff-1258e1f341ca\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family:'Fraunces'; font-style:italic; font-weight:500; font-display:swap;\n  src:url(\"747a5f52-c2d7-4663-a5e6-09f2aa993b3a\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }\n\n@font-face { font-family:'Fraunces'; font-style:italic; font-weight:600; font-display:swap;\n  src:url(\"ed52488c-16d8-40d5-a8f7-e9a73ccffefb\") format('woff2');\n  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }\n@font-face { font-family:'Fraunces'; font-style:italic; font-weight:600; font-display:swap;\n  src:url(\"6ec10544-29b0-4fc4-a9c9-bcf58abf36e9\") format('woff2');\n  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }\n\n/* ===========================================================================\n   ULTREIA, COLOR\n   4 colores institucionales + sanguina (acento cálido) + técnico.\n   Mint y Sanguina son FAROS, nunca baños. Mint nunca compite con Sanguina\n   en el mismo elemento.\n   ===========================================================================*/\n:root {\n  /* ---- Marca / base ---- */\n  --night:        #0E2A33; /* Noche Ultreia, fondo por defecto, sustrato premium */\n  --night-deep:   #071A22; /* nuance interna, halos radiales sobre Noche */\n  --night-700:    #143843; /* Noche elevada, superficies/tarjetas sobre Noche */\n  --night-600:    #1C4854; /* bordes/divisores sobre Noche */\n  --pilgrim:      #F7F5EF; /* Blanco Peregrino, secciones editoriales/respiro */\n  --pilgrim-200:  #EFEBE0; /* Peregrino sombreado, tarjetas sobre Peregrino */\n  --pilgrim-300:  #E3DDCB; /* bordes sobre Peregrino */\n  --white:        #FFFFFF; /* solo PDF / contraste máximo / impresión técnica */\n\n  /* ---- Acento frío: Mint Camino (marca, navegación, faro institucional) ---- */\n  --mint:         #32B4A0;\n  --mint-600:     #36B2B6; /* vert d'eau con matiz lavanda \\u2014 hover/press, suave */\n  --mint-300:     #96C8BE; /* Mint Pálido, texto secundario sobre Noche */\n  --mint-100:     #D6EAE5; /* tinte muy suave sobre Peregrino */\n\n  /* ---- Acento cálido: Sanguina (CTAs de producto, badges, family) ----\n     Terracota que tira a rojo «sanguine», suavemente pastel, entre dorado y rojo. */\n  --sanguina:     #D2655B; /* rojo sanguina base, terracota rosado, validado */\n  --sanguina-600: #C5564E; /* hover/press, más profundo, dentro del pastel */\n  --sanguina-300: #E5A097; /* tinte pastel */\n  --sanguina-100: #F6E1DC; /* fondo de badge muy suave */\n\n  /* ---- Cálidos de ilustración (de aquí viene el grueso del calor) ---- */\n  --ember:        #C5564E; /* rojo sanguina \\u2014 con un punto de rosa pastel */\n  --amber:        #E9A93C; /* ámbar/dorado */\n  --amber-100:    #F6E4BE;\n\n  /* =========================================================================\n     ALIAS SEMÁNTICOS\n     ========================================================================= */\n\n  /* Superficies, registro institucional (oscuro) */\n  --surface:            var(--night);\n  --surface-raised:     var(--night-700);\n  --surface-overlay:    var(--night-deep);\n  --border-dark:        var(--night-600);\n\n  /* Superficies, registro editorial/producto (claro) */\n  --surface-warm:       var(--pilgrim);\n  --surface-warm-card:  var(--pilgrim-200);\n  --border-warm:        var(--pilgrim-300);\n\n  /* Texto sobre Noche */\n  --text-on-dark:        var(--pilgrim);\n  --text-on-dark-soft:   var(--mint-300);\n  --text-on-dark-muted:  #6E8A8F;\n\n  /* Texto sobre Peregrino */\n  --text:                var(--night);\n  --text-soft:           #43616A;\n  --text-muted:          #7A8E92;\n\n  /* Acentos funcionales */\n  --accent-cool:        var(--mint);    /* faro institucional */\n  --accent-cool-hover:  var(--mint-600);\n  --accent-warm:        var(--sanguina);/* CTA de producto / descubrimiento */\n  --accent-warm-hover:  var(--sanguina-600);\n\n  /* Estados */\n  --focus-ring:         var(--mint);\n  --danger:             var(--ember);\n  --highlight:          var(--amber);\n}\n\n/* ===========================================================================\n   ULTREIA, TIPOGRAFÍA\n   Outfit → todo el sistema: UI, body, titulares y display.\n   Fraunces → SOLO citas y títulos de historia (nombres de serie / carátulas).\n   Nunca Fraunces en UI funcional, menús, botones, secciones ni body.\n   ===========================================================================*/\n:root {\n  /* Familias */\n  --font-sans:   'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  --font-serif:  'Fraunces', 'Iowan Old Style', Georgia, serif; /* solo citas + títulos de historia */\n  --font-display: var(--font-sans); /* display de UI/editorial = Outfit */\n  --font-story:   var(--font-serif); /* alias semántico: títulos de historia y citas */\n\n  /* Pesos */\n  --w-light:     300; /* @kind font */\n  --w-regular:   400; /* @kind font */\n  --w-medium:    500; /* @kind font */\n  --w-semibold:  600; /* @kind font */\n  --w-bold:      700; /* @kind font */\n  --w-black:     800; /* @kind font */\n\n  /* Escala tipográfica (rem, base 16px), generosa, pensada para pantalla */\n  --fs-display-xl: 4.5rem;   /* 72, hero display Outfit */\n  --fs-display-l:  3.25rem;  /* 52, display Outfit */\n  --fs-display-m:  2.25rem;  /* 36, titulares grandes, citas */\n  --fs-h1:         2rem;     /* 32 */\n  --fs-h2:         1.5rem;   /* 24 */\n  --fs-h3:         1.25rem;  /* 20 */\n  --fs-body-lg:    1.125rem; /* 18 */\n  --fs-body:       1rem;     /* 16 */\n  --fs-body-sm:    0.875rem; /* 14 */\n  --fs-caption:    0.75rem;  /* 12 */\n  --fs-eyebrow:    0.6875rem;/* 11 */\n\n  /* Interlineado */\n  --lh-tight:   1.05; /* @kind other */\n  --lh-snug:    1.2;  /* @kind other */\n  --lh-normal:  1.5;  /* @kind other */\n  --lh-relaxed: 1.65; /* @kind other */\n\n  /* Tracking */\n  --ls-display:  -0.02em; /* @kind other */\n  --ls-tight:    -0.01em; /* @kind other */\n  --ls-normal:   0;       /* @kind other */\n  --ls-caption:  0.25em;  /* @kind other */\n  --ls-eyebrow:  0.3em;   /* @kind other */\n}\n\n/* ===========================================================================\n   ULTREIA, ESPACIADO, RADIOS, SOMBRAS, MOVIMIENTO\n   Esquinas suaves, formas orgánicas. Nada anguloso.\n   ===========================================================================*/\n:root {\n  /* Escala de espaciado (base 4px) */\n  --space-1:  0.25rem;  /*  4 */\n  --space-2:  0.5rem;   /*  8 */\n  --space-3:  0.75rem;  /* 12 */\n  --space-4:  1rem;     /* 16 */\n  --space-5:  1.5rem;   /* 24 */\n  --space-6:  2rem;     /* 32 */\n  --space-7:  3rem;     /* 48 */\n  --space-8:  4rem;     /* 64 */\n  --space-9:  6rem;     /* 96 */\n\n  /* Radios, suaves, generosos. Las tarjetas de catálogo redondean fuerte. */\n  --radius-sm:   8px;\n  --radius-md:   14px;\n  --radius-lg:   20px;\n  --radius-xl:   28px;\n  --radius-2xl:  40px;\n  --radius-pill: 999px;\n\n  /* Sombras, cálidas y suaves sobre claro; profundas y limpias sobre oscuro.\n     Nunca duras ni de dashboard. */\n  --shadow-sm:   0 1px 2px rgba(14, 42, 51, 0.06), 0 2px 6px rgba(14, 42, 51, 0.05);\n  --shadow-md:   0 4px 12px rgba(14, 42, 51, 0.08), 0 10px 30px rgba(14, 42, 51, 0.07);\n  --shadow-lg:   0 12px 28px rgba(14, 42, 51, 0.12), 0 30px 60px rgba(14, 42, 51, 0.10);\n  /* sombra cálida para carátulas/CTA de producto */\n  --shadow-warm: 0 10px 30px rgba(192, 67, 43, 0.18);\n  /* elevación sobre Noche */\n  --shadow-dark: 0 16px 40px rgba(0, 0, 0, 0.35);\n\n  /* Halo radial mint sobre Noche, el fondo nunca es plano */\n  --halo-mint: radial-gradient(60% 60% at 70% 18%, rgba(50,180,160,0.18), rgba(50,180,160,0) 70%); /* @kind other */\n  --halo-warm: radial-gradient(55% 55% at 22% 80%, rgba(226,116,47,0.14), rgba(226,116,47,0) 70%); /* @kind other */\n\n  /* Movimiento, fundidos suaves, micro-rebote en producto. Nunca brusco. */\n  --ease-soft:   cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast:    140ms; /* @kind other */\n  --dur-base:    240ms; /* @kind other */\n  --dur-slow:    420ms; /* @kind other */\n\n  /* Contenedores */\n  --container:   1200px; /* @kind spacing */\n  --container-narrow: 760px; /* @kind spacing */\n}\n\n<\u002Fstyle>\n<script src=\"2162e1ec-ce1f-4b87-b594-220a260b7d5e\"><\u002Fscript>\n<style>\n  html, body { margin:0; background:var(--night); -webkit-font-smoothing:antialiased; }\n  a.uln { color: var(--mint-300); text-decoration:none; transition: color 180ms cubic-bezier(0.22,0.61,0.36,1); }\n  a.uln:hover { color: var(--mint) !important; }\n  .wl-input { transition: border-color 200ms ease, background 200ms ease; }\n  .wl-input:focus { outline:none; border-color: var(--mint) !important; background: rgba(247,245,239,0.10) !important; }\n  .wl-input::placeholder { color: rgba(247,245,239,0.42); }\n  .wl-btn { transition: transform 160ms ease, background 180ms ease, box-shadow 180ms ease; }\n  .wl-btn:hover { background: var(--mint-300) !important; box-shadow: 0 12px 32px rgba(50,180,160,0.5) !important; }\n  .wl-btn:active { transform: scale(0.96); }\n  .wbar { transform-origin: center; }\n  @keyframes wave1 { 0%,100% { transform: scaleY(0.22); } 25% { transform: scaleY(1); } 55% { transform: scaleY(0.45); } 80% { transform: scaleY(0.85); } }\n  @keyframes wave2 { 0%,100% { transform: scaleY(0.9); } 30% { transform: scaleY(0.3); } 60% { transform: scaleY(1); } 85% { transform: scaleY(0.5); } }\n  @keyframes wave3 { 0%,100% { transform: scaleY(0.4); } 20% { transform: scaleY(0.7); } 50% { transform: scaleY(0.2); } 75% { transform: scaleY(1); } }\n  @keyframes wave4 { 0%,100% { transform: scaleY(1); } 35% { transform: scaleY(0.35); } 65% { transform: scaleY(0.8); } 90% { transform: scaleY(0.28); } }\n  @keyframes wave5 { 0%,100% { transform: scaleY(0.5); } 15% { transform: scaleY(1); } 45% { transform: scaleY(0.3); } 70% { transform: scaleY(0.65); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div data-screen-label=\"Landing\" style=\"position:relative; width:100%; min-height:100vh; overflow:hidden; background:var(--night); display:flex; flex-direction:column;\">\n\n  <!-- Fixed Noche backdrop -->\n  <div style=\"position:fixed; inset:0; z-index:0; pointer-events:none; background:var(--night);\">\n    <div style=\"position:absolute; inset:0; background:radial-gradient(60% 50% at 50% 6%, rgba(50,180,160,0.15), rgba(50,180,160,0) 60%);\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:0; background:radial-gradient(54% 46% at 14% 74%, rgba(226,116,47,0.11), rgba(226,116,47,0) 64%);\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:0; background:radial-gradient(48% 44% at 88% 82%, rgba(50,180,160,0.08), rgba(50,180,160,0) 64%);\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:0; opacity:0.035; background-image:linear-gradient(var(--mint-300) 1px, transparent 1px), linear-gradient(90deg, var(--mint-300) 1px, transparent 1px); background-size:40px 40px;\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:0; background:radial-gradient(120% 92% at 50% 44%, rgba(0,0,0,0) 48%, rgba(0,0,0,0.55) 100%);\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:relative; z-index:1; flex:1; display:flex; flex-direction:column;\">\n\n    <!-- Top bar: logo -->\n    <div style=\"padding:32px 40px 0; display:flex; justify-content:center;\">\n      <img src=\"cab163c3-54af-48b2-8052-5d2db31ce5de\" alt=\"Ultreia Audio\" style=\"height:34px; display:block;\">\n    <\u002Fdiv>\n\n    <!-- Hero -->\n    <section style=\"position:relative; flex:1; display:flex; align-items:center;\">\n      <div style=\"position:relative; width:100%; max-width:640px; margin:0 auto; padding:56px 40px; text-align:center;\">\n        <div style=\"font-family:'Outfit',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.34em; text-transform:uppercase; color:var(--mint); margin-bottom:30px;\">Audioficción que inspira<\u002Fdiv>\n        <h1 style=\"font-family:'Outfit',sans-serif; font-weight:800; font-size:3.5rem; line-height:1.08; letter-spacing:-0.025em; margin:0; color:var(--pilgrim);\">La Historia que te hizo grande, <span style=\"color:var(--mint);\">ahora contada para niños y familias.<\u002Fspan><\u002Fh1>\n\n        <!-- waveform -->\n        <div style=\"display:flex; align-items:center; justify-content:center; gap:3px; height:34px; margin:36px 0 6px;\">\n          <sc-for list=\"{{ wave }}\" as=\"bar\" hint-placeholder-count=\"42\"><div class=\"wbar\" style=\"width:3px; border-radius:9px; background:var(--mint); opacity:0.8; height:{{ bar.h }}px; animation:{{ bar.anim }};\"><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- Waitlist -->\n        <div style=\"margin-top:32px;\">\n          <sc-if value=\"{{ notDone }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"max-width:460px; margin:0 auto;\">\n              <div style=\"font-family:'Outfit',sans-serif; font-size:1.08rem; color:var(--text-on-dark-soft); margin-bottom:22px; line-height:1.55;\">Estamos preparando el estreno. Déjanos tu correo y serás de los primeros en escuchar.<\u002Fdiv>\n              <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:flex; gap:10px; align-items:stretch;\">\n                <input class=\"wl-input\" type=\"email\" required=\"\" value=\"{{ email }}\" sc-camel-on-input=\"{{ onInput }}\" placeholder=\"tu@correo.es\" style=\"flex:1; min-width:0; padding:0 20px; height:54px; border-radius:999px; border:1.5px solid var(--night-600); background:rgba(247,245,239,0.06); color:var(--pilgrim); font-family:'Outfit',sans-serif; font-size:15px; font-weight:500;\">\n                <button type=\"submit\" class=\"wl-btn\" style=\"flex:0 0 auto; padding:0 28px; height:54px; border-radius:999px; border:none; cursor:pointer; background:var(--mint); color:var(--night); font-family:'Outfit',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.01em; box-shadow:0 8px 24px rgba(50,180,160,0.35);\">Unirme<\u002Fbutton>\n              <\u002Fform>\n              <div style=\"font-family:'Outfit',sans-serif; font-size:12.5px; color:var(--text-on-dark-muted); margin-top:16px; line-height:1.5;\">Sin spam. Solo el aviso de lanzamiento y una historia de regalo. Consulta la <a class=\"uln\" href=\"#info\">privacidad<\u002Fa>.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ done }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"max-width:480px; margin:0 auto; background:var(--night-700); border:1px solid rgba(50,180,160,0.4); border-radius:var(--radius-xl); padding:32px 34px; box-shadow:0 24px 50px rgba(0,0,0,0.4);\">\n              <div style=\"display:inline-flex; width:48px; height:48px; align-items:center; justify-content:center; border-radius:50%; background:rgba(50,180,160,0.16); color:var(--mint); margin-bottom:16px;\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div style=\"font-family:'Outfit',sans-serif; font-weight:700; font-size:1.35rem; color:var(--pilgrim); margin-bottom:8px;\">Estás en la lista.<\u002Fdiv>\n              <div style=\"font-family:'Outfit',sans-serif; font-size:1.02rem; color:var(--text-on-dark-soft); line-height:1.55;\">Te escribiremos a <span style=\"color:var(--mint-300); font-weight:600;\">{{ savedEmail }}<\u002Fspan> en cuanto abramos las puertas. Gracias por acompañarnos desde el principio.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Info strip (prerequisitos cuenta / app) -->\n    <section id=\"info\" style=\"position:relative;\">\n      <div style=\"max-width:1000px; margin:0 auto; padding:24px 40px 56px;\">\n        <div style=\"border-top:1px solid var(--night-600); padding-top:40px; display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:36px;\">\n          <div>\n            <div style=\"font-family:'Outfit',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--mint); margin-bottom:14px;\">Qué es Ultreia<\u002Fdiv>\n            <p style=\"font-family:'Outfit',sans-serif; font-size:0.98rem; line-height:1.6; color:var(--text-on-dark-soft); margin:0;\">Ultreia Audio es una app de audioficción cultural para niños y familias, en castellano. Relatos sonoros de grandes figuras y gestas, narrados por actores reales, para escuchar sin pantallas: en el coche, en casa o en el aula.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Outfit',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--mint); margin-bottom:14px;\">Contacto<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:9px; font-family:'Outfit',sans-serif; font-size:0.95rem; color:var(--text-on-dark-soft);\">\n              <a class=\"uln\" href=\"mailto:hola@ultreia.audio\">hola@ultreia-audio.com<\u002Fa>\n              \n              <span style=\"color:var(--text-on-dark-muted);\">Madrid, España<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Outfit',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--mint); margin-bottom:14px;\">Legal<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:9px; font-family:'Outfit',sans-serif; font-size:0.95rem;\">\n              <a class=\"uln\" href=\"/privacy\">Política de privacidad<\u002Fa>\n              <a class=\"uln\" href=\"/terms-of-use\">Condiciones de contratación<\u002Fa>\n              <a class=\"uln\" href=\"#\">Soporte<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Footer -->\n    <footer style=\"border-top:1px solid var(--night-600);\">\n      <div style=\"max-width:1000px; margin:0 auto; padding:22px 40px; display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; font-family:'Outfit',sans-serif; font-size:13px; color:var(--text-on-dark-muted);\">\n        <span>© 2026 Ultreia Audio SL, CIF&nbsp; B-22596639, Madrid, España<\u002Fspan>\n        <span style=\"color:var(--mint-300);\">Audio que inspira<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { email: '', saved: '', done: false };\n  }\n  wave(n, seed) {\n    const a = [];\n    for (let i = 0; i < n; i++) {\n      const base = Math.abs(Math.sin(i * 0.55 + seed)) * 22 + Math.abs(Math.cos(i * 1.3 + seed)) * 8;\n      const rnd = (k) => { const x = Math.sin((i + 1) * (k + seed) * 12.9898) * 43758.5453; return x - Math.floor(x); };\n      const name = 'wave' + (1 + Math.floor(rnd(1) * 5));\n      const dur = (0.5 + rnd(2) * 0.7).toFixed(2);\n      const delay = (-rnd(3) * 1.4).toFixed(2);\n      a.push({\n        h: Math.max(6, Math.min(34, Math.round(base + 5))),\n        anim: name + ' ' + dur + 's ease-in-out ' + delay + 's infinite',\n      });\n    }\n    return a;\n  }\n  renderVals() {\n    return {\n      email: this.state.email,\n      savedEmail: this.state.saved,\n      done: this.state.done,\n      notDone: !this.state.done,\n      wave: this.wave(42, 1.2),\n      onInput: (e) => this.setState({ email: e.target.value }),\n      onSubmit: (e) => {\n        e.preventDefault();\n        const v = (this.state.email || '').trim();\n        if (!v) return;\n        this.setState({ done: true, saved: v });\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

<script>
/* Apple/domaine: aligne toute référence ultreia.audio -> ultreia-audio.com (texte + href) après rendu */
(function(){
  var RX=/ultreia\.audio(?!-)/g, NEWD="ultreia-audio.com";
  function fix(){
    try{
      document.querySelectorAll('a[href*="ultreia.audio"]').forEach(function(a){
        a.setAttribute('href', a.getAttribute('href').replace(RX,NEWD));
      });
      var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),n;
      while(n=w.nextNode()){ if(n.nodeValue&&n.nodeValue.indexOf('ultreia.audio')>-1){ n.nodeValue=n.nodeValue.replace(RX,NEWD);} }
    }catch(e){}
  }
  function start(){ fix(); try{ new MutationObserver(fix).observe(document.body,{childList:true,subtree:true,characterData:true}); }catch(e){} [400,1200,3000,6000].forEach(function(t){setTimeout(fix,t);}); }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',start);}else{start();}
})();
</script>
